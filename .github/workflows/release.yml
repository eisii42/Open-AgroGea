name: release-oss

# Pubblica gli installer quando spingi un tag vX.Y.Z (firma dell'updater;
# per la firma di codice Windows/Android vedi docs/technical/code-signing.md).
# tauri-action genera anche `latest.json` (createUpdaterArtifacts:true) e lo allega
# alla Release: l'endpoint dell'updater punta proprio a quel file. Repo PUBBLICO,
# quindi raw/releases sono raggiungibili senza autenticazione.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set version from git tag
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - run: npm install --legacy-peer-deps

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/agro-field-suite
          tagName: ${{ github.ref_name }}
          releaseName: "AgroGea ${{ github.ref_name }}"
          releaseBody: "Aggiornamento automatico. Vedi il changelog nel banner dell'app."
          releaseDraft: false
          prerelease: false
