name: release-oss

# Pubblica gli installer quando spingi un tag vX.Y.Z (firma dell'updater; la
# firma di codice Windows/Android non è ancora attiva).
# tauri-action genera anche `latest.json` (createUpdaterArtifacts:true) e lo allega
# alla Release: l'endpoint dell'updater punta proprio a quel file. Repo PUBBLICO,
# quindi raw/releases sono raggiungibili senza autenticazione.

# Le note della Release si leggono da docs/releases/<tag>.md (tauri-action v1
# riscrive titolo e testo di una Release esistente: vanno passati da qui).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set version from git tag
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/set-version.mjs "$env:TAG"

      - name: Release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG}.md"
          {
            echo "body<<AGROGEA_RELEASE_NOTES"
            if [ -f "$notes" ]; then
              cat "$notes"
            else
              echo "Aggiornamento automatico. Vedi il changelog nel banner dell'app."
            fi
            echo "AGROGEA_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - run: npm install --legacy-peer-deps

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/agro-field-suite
          tagName: ${{ github.ref_name }}
          releaseName: "AgroGea ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
