name: quality

# Quality gate: typecheck, domain tests and lint on every push and pull
# request, plus `cargo check` and the unit tests of the Tauri crate. The
# release installers are built by `release.yml`.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Librerie di sistema richieste da Tauri v2 su Linux (WebKitGTK) e da
      # native-tls (OpenSSL).
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/agro-field-suite/src-tauri

      # generate_context! incorpora `frontendDist` (../dist): per compilare
      # basta che la cartella esista, il bundle web non serve.
      - name: Placeholder frontend
        run: mkdir -p apps/agro-field-suite/dist

      - name: Cargo check
        run: cargo check --locked --manifest-path apps/agro-field-suite/src-tauri/Cargo.toml

      - name: Cargo test
        run: cargo test --locked --lib --manifest-path apps/agro-field-suite/src-tauri/Cargo.toml
