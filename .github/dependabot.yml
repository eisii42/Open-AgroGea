version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - dependencies
      - security
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@electric-sql/pglite"
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      maplibre-ecosystem:
        patterns:
          - "maplibre-gl"
          - "maplibre-gl-*"
          - "@maplibre/*"
          - "@deck.gl/*"
          - "@developmentseed/*"
          - "@carbonplan/*"
          - "@geoman-io/*"
          - "three"
      npm-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "@tauri-apps/*"
          - "maplibre-gl"
          - "maplibre-gl-*"
          - "@maplibre/*"
          - "@deck.gl/*"
          - "@developmentseed/*"
          - "@carbonplan/*"
          - "@geoman-io/*"
          - "three"

  - package-ecosystem: cargo
    directory: "/apps/agro-field-suite/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - dependencies
      - security
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Rome
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
