version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - dependencies
      - security
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/apps/agro-field-suite/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - dependencies
      - security
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Rome
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
